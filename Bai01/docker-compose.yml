# Bai01: Postgres (volume = data bền) + app Node build multi-stage
# Chạy từ thư mục Bai01: docker compose up --build
# Data: volume postgres_data — `docker compose down` giữ data; xóa hẳn: docker compose down -v

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: bai01
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d bai01"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://demo:demo@db:5432/bai01
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
