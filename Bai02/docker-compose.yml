# Chạy từ thư mục Bai02: docker compose up --build
# MariaDB cổng host 3307 (tránh trùng MySQL/MariaDB cài sẵn trên máy)

services:
  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: partition_demo
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  app:
    build: .
    ports:
      - "3002:3000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: partition_demo
      DB_USER: root
      DB_PASSWORD: root
      DB_DIALECT: mysql
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data:
