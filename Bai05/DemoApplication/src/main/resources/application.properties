spring.application.name=DemoApplication
server.port=8080

# MSSQL_PORT: mặc định 1433 (SQL cài trên máy). Với Docker trong Bai05 (map 14333:1433) hãy đặt MSSQL_PORT=14333.
spring.datasource.url=jdbc:sqlserver://${MSSQL_HOST:localhost}:${MSSQL_PORT:1433};databaseName=${MSSQL_DATABASE:demo_search};encrypt=true;trustServerCertificate=true
spring.datasource.username=${MSSQL_USER:sa}
spring.datasource.password=${MSSQL_SA_PASSWORD:YourStrong@Passw0rd}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
