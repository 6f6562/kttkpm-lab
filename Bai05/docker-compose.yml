# Chạy từ thư mục Bai05: docker compose up -d
# SQL Server: cổng host 14333 -> 1433 trong container (tránh trùng SQL Server cài sẵn Windows thường dùng 1433).
# Sau khi container healthy, tạo database demo_search (xem HUONG_DAN.txt).

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bai05-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd}"
    ports:
      - "14333:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
